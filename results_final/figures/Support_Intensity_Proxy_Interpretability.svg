<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#1f2933">Shared support-intensity proxy interpretation</text>
<text x="24" y="58" font-family="Arial, sans-serif" font-size="12" fill="#52616b">Transportable proxy, not full VIS; designed to align MIMIC and eICU support information.</text>
<rect x="350" y="250" width="280" height="56" rx="10" fill="#243447"/>
<text x="385" y="282" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">shared_support_intensity_proxy</text>
<rect x="80" y="130" width="180" height="70" rx="10" fill="#9a463d"/>
<text x="96" y="156" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Hemodynamic</text>
<text x="96" y="178" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">MAP deficit + vasoactive exposure pr</text>
<line x1="170" y1="202" x2="490" y2="250" stroke="#52616b" stroke-width="1.5"/>
<rect x="285" y="130" width="180" height="70" rx="10" fill="#946b2d"/>
<text x="301" y="156" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Lactate</text>
<text x="301" y="178" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">lactate level / recent burden signal</text>
<line x1="375" y1="202" x2="490" y2="250" stroke="#52616b" stroke-width="1.5"/>
<rect x="490" y="130" width="180" height="70" rx="10" fill="#496f5d"/>
<text x="506" y="156" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Renal</text>
<text x="506" y="178" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">urine-output decline / renal support</text>
<line x1="580" y1="202" x2="490" y2="250" stroke="#52616b" stroke-width="1.5"/>
<rect x="695" y="130" width="180" height="70" rx="10" fill="#2f7da1"/>
<text x="711" y="156" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Respiratory</text>
<text x="711" y="178" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">ventilation escalation / oxygenation</text>
<line x1="785" y1="202" x2="490" y2="250" stroke="#52616b" stroke-width="1.5"/>
</svg>